name: Research spike
description: Time-boxed investigation with a decision-oriented outcome
title: "[SPIKE] "
labels: ["spike", "needs-spec"]
body:
  - type: textarea
    id: question
    attributes:
      label: Research question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and known constraints
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and evaluation criteria
  - type: textarea
    id: deliverable
    attributes:
      label: Expected output (evidence, recommendation, ADR or follow-up issues)
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: 45 minutes
    validations:
      required: true
