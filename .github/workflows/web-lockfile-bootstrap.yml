name: Web lockfile bootstrap

on:
  push:
    branches:
      - chore/web-lockfile-bootstrap

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate deterministic install and application build
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Switch production image to npm ci and build it
        run: |
          sed -i '/COPY apps\/web\/package.json .\/package.json/a COPY apps/web/package-lock.json ./package-lock.json' apps/web/Dockerfile
          sed -i 's/RUN npm install --no-audit --no-fund/RUN npm ci --no-audit --no-fund/' apps/web/Dockerfile
          docker build --file apps/web/Dockerfile --tag ai-service-marketplace-web:lockfile .
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json apps/web/Dockerfile
          git rm .github/workflows/web-lockfile-bootstrap.yml
          git commit -m "build(web): lock npm dependency tree"
          git push origin HEAD:chore/web-lockfile-bootstrap
