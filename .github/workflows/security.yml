name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base commit SHA used for exact-head dependency review"
        required: false
        default: main
        type: string

# The workflow itself gets no write permissions. Each analysis job receives
# only the permissions required for its own GitHub API surface.
permissions:
  contents: read

# Cancel superseded runs only for the same workflow/ref. Different PR branches
# keep isolated checks and never cancel one another.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - id: detect
        name: Detect source languages
        shell: bash
        run: |
          set -euo pipefail
          languages=()
          if find . -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            languages+=('"python"')
          fi
          if find . -name '*.go' -not -path './.git/*' -print -quit | grep -q .; then
            languages+=('"go"')
          fi
          if find . \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -not -path './.git/*' -print -quit | grep -q .; then
            languages+=('"javascript-typescript"')
          fi
          if [ "${#languages[@]}" -eq 0 ]; then
            languages+=('"python"')
          fi
          printf 'languages=[%s]\n' "$(IFS=,; echo "${languages[*]}")" >> "$GITHUB_OUTPUT"

  codeql:
    # Preserve the exact required-check context configured in the main ruleset:
    # Go is historically "CodeQL (go)", while the other language contexts are
    # lowercase "codeql (<language>)". Do not rename these contexts casually.
    name: ${{ matrix.language == 'go' && 'CodeQL' || 'codeql' }} (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066

  dependency-review:
    # Run on PRs and on explicitly dispatched rebased heads using exact base/head refs.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          comment-summary-in-pr: never
