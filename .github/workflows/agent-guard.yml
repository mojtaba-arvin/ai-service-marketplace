name: Agent Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Reject protected-path changes from implementation agents
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(\.github/|tests/spec/)'; then
            echo "Implementation agent branches may not modify protected policy or spec-test paths."
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -qx 'feature_list.json'; then
            echo "feature_list.json status changes require independent QA; direct edits are forbidden."
            exit 1
          fi
