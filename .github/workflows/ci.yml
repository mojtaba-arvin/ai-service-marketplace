name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.paths.outputs.integration }}
      api_image: ${{ steps.paths.outputs.api_image }}
      web_image: ${{ steps.paths.outputs.web_image }}
      images: ${{ steps.paths.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Determine affected validation lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        shell: bash
        run: |
          set -euo pipefail
          integration=true
          api_image=true
          web_image=true
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            case "$EVENT_NAME" in
              pull_request)
                base="$PR_BASE_SHA"
                head="$PR_HEAD_SHA"
                if ! git cat-file -e "$head^{commit}" 2>/dev/null; then
                  git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
                  head=FETCH_HEAD
                fi
                ;;
              merge_group)
                base="$MERGE_BASE_SHA"
                head="$MERGE_HEAD_SHA"
                ;;
              push)
                base="$PUSH_BEFORE"
                head="$PUSH_AFTER"
                if [[ "$base" =~ ^0+$ ]]; then
                  base=""
                fi
                ;;
              *)
                base=""
                head=""
                ;;
            esac

            if [[ -n "$base" && -n "$head" ]] && git cat-file -e "$base^{commit}" 2>/dev/null && git cat-file -e "$head^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$base" "$head")"
              integration=false
              api_image=false
              web_image=false
              while IFS= read -r path; do
                [[ -z "$path" ]] && continue
                case "$path" in
                  apps/api/*|apps/web/*|infra/*|packages/contracts/*|packages/domain-*/*|scripts/e2e-*.sh|.github/workflows/ci.yml)
                    integration=true
                    ;;
                esac
                case "$path" in
                  apps/api/*|.dockerignore|.github/workflows/ci.yml)
                    api_image=true
                    ;;
                esac
                case "$path" in
                  apps/web/*|.dockerignore|.github/workflows/ci.yml)
                    web_image=true
                    ;;
                esac
              done <<< "$changed"
            fi
          fi

          images=false
          if [[ "$api_image" == "true" || "$web_image" == "true" ]]; then
            images=true
          fi
          printf 'integration=%s\napi_image=%s\nweb_image=%s\nimages=%s\n' \
            "$integration" "$api_image" "$web_image" "$images" >> "$GITHUB_OUTPUT"
          printf 'Integration: %s\nAPI image: %s\nWeb image: %s\n' \
            "$integration" "$api_image" "$web_image"

  repository:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.mod
      - name: Verify repository contracts and scripts
        env:
          VERIFY_SKIP_GO_TESTS: "1"
        run: make verify
      - name: Run Go tests with race detection
        working-directory: apps/api
        run: go test -race ./...
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose configuration
        shell: bash
        run: |
          cat > /tmp/mvp.env <<'EOF'
          SITE_ADDRESS=market.example.test
          POSTGRES_DB=marketplace
          POSTGRES_USER=marketplace
          POSTGRES_PASSWORD=ci-only-password
          DATABASE_URL=postgres://marketplace:ci-only-password@postgres:5432/marketplace?sslmode=disable
          OTP_DELIVERY_URL=https://otp.example.test/send
          OTP_DELIVERY_TOKEN=ci-only-token
          OTP_PEPPER=0123456789abcdef0123456789abcdef
          SESSION_PEPPER=abcdef0123456789abcdef0123456789
          DEFAULT_TENANT_ID=market-om
          DEFAULT_MARKET_CODE=OM
          BOOTSTRAP_OPERATOR_PHONE=+96890000000
          EOF
          docker compose --env-file /tmp/mvp.env -f infra/compose.production.yml config --quiet

  integration:
    name: PostgreSQL and browser integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.64.1
      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('apps/web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('apps/web/package-lock.json') }}-
      - name: Run walking-skeleton, browser, and backup/restore E2E
        run: bash scripts/e2e-walking-skeleton.sh

  images:
    name: Production container image builds
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production API image
        if: needs.changes.outputs.api_image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ai-service-marketplace-api:ci
          load: true
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max
      - name: Build production Web image
        if: needs.changes.outputs.web_image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: ai-service-marketplace-web:ci
          load: true
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,scope=web-image,mode=max

  verify:
    name: verify
    if: always()
    needs: [changes, repository, integration, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable verification lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INTEGRATION_REQUIRED: ${{ needs.changes.outputs.integration }}
          IMAGES_RESULT: ${{ needs.images.result }}
          IMAGES_REQUIRED: ${{ needs.changes.outputs.images }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Path classification: %s\n' "$CHANGES_RESULT"
          printf 'Repository verification: %s\n' "$REPOSITORY_RESULT"
          printf 'PostgreSQL/browser integration: %s (required=%s)\n' "$INTEGRATION_RESULT" "$INTEGRATION_REQUIRED"
          printf 'Production image builds: %s (required=%s)\n' "$IMAGES_RESULT" "$IMAGES_REQUIRED"
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$REPOSITORY_RESULT" == "success" ]]
          if [[ "$INTEGRATION_REQUIRED" == "true" ]]; then
            [[ "$INTEGRATION_RESULT" == "success" ]]
          else
            [[ "$INTEGRATION_RESULT" == "skipped" ]]
            echo "Integration E2E explicitly skipped: no API, Web, infrastructure, contract, or E2E-script paths changed."
          fi
          if [[ "$IMAGES_REQUIRED" == "true" ]]; then
            [[ "$IMAGES_RESULT" == "success" ]]
          else
            [[ "$IMAGES_RESULT" == "skipped" ]]
            echo "Container builds explicitly skipped: no image inputs changed."
          fi
