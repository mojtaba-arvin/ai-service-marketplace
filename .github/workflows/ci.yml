name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - name: Verify repository contracts and scripts
        env:
          VERIFY_SKIP_GO_TESTS: "1"
        run: make verify
      - name: Verify Go formatting without modifying the checkout
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files require gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Run Go tests with race detection
        working-directory: apps/api
        run: go test -race ./...
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose configuration
        shell: bash
        run: |
          cat > /tmp/mvp.env <<'EOF'
          SITE_ADDRESS=market.example.test
          POSTGRES_DB=marketplace
          POSTGRES_USER=marketplace
          POSTGRES_PASSWORD=ci-only-password
          DATABASE_URL=postgres://marketplace:ci-only-password@postgres:5432/marketplace?sslmode=disable
          OTP_DELIVERY_URL=https://otp.example.test/send
          OTP_DELIVERY_TOKEN=ci-only-token
          OTP_PEPPER=0123456789abcdef0123456789abcdef
          SESSION_PEPPER=abcdef0123456789abcdef0123456789
          DEFAULT_TENANT_ID=market-om
          DEFAULT_MARKET_CODE=OM
          BOOTSTRAP_OPERATOR_PHONE=+96890000000
          EOF
          docker compose --env-file /tmp/mvp.env -f infra/compose.production.yml config --quiet

  integration:
    name: PostgreSQL and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - name: Run walking-skeleton, browser, and backup/restore E2E
        run: bash scripts/e2e-walking-skeleton.sh

  api-image:
    name: Build production API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image with persistent GitHub Actions layer cache
        run: |
          docker buildx build --load --progress plain \
            --file apps/api/Dockerfile \
            --tag ai-service-marketplace-api:ci \
            --cache-from type=gha,scope=api-image \
            --cache-to type=gha,scope=api-image,mode=max .

  web-image:
    name: Build production Web image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Web image with persistent GitHub Actions layer cache
        run: |
          docker buildx build --load --progress plain \
            --file apps/web/Dockerfile \
            --tag ai-service-marketplace-web:ci \
            --cache-from type=gha,scope=web-image \
            --cache-to type=gha,scope=web-image,mode=max .

  verify:
    name: verify
    if: always()
    needs: [repository, integration, api-image, web-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification lane
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          API_IMAGE_RESULT: ${{ needs.api-image.result }}
          WEB_IMAGE_RESULT: ${{ needs.web-image.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Repository verification: %s\n' "$REPOSITORY_RESULT"
          printf 'PostgreSQL/browser integration: %s\n' "$INTEGRATION_RESULT"
          printf 'API image build: %s\n' "$API_IMAGE_RESULT"
          printf 'Web image build: %s\n' "$WEB_IMAGE_RESULT"
          for result in "$REPOSITORY_RESULT" "$INTEGRATION_RESULT" "$API_IMAGE_RESULT" "$WEB_IMAGE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required verification lane did not succeed."
              exit 1
            fi
          done
