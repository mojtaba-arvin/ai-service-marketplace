name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/api/go.mod
      - name: Resolve Go module checksums
        working-directory: apps/api
        run: go mod tidy -diff
      - name: Verify repository
        run: |
          chmod +x scripts/verify.sh
          make verify
      - name: Verify Go formatting and tests
        working-directory: apps/api
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files require gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go test -race ./...
      - name: Run walking-skeleton HTTP E2E
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: bash scripts/e2e-walking-skeleton.sh
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose configuration
        run: |
          cat > /tmp/mvp.env <<'EOF'
          SITE_ADDRESS=market.example.test
          POSTGRES_DB=marketplace
          POSTGRES_USER=marketplace
          POSTGRES_PASSWORD=ci-only-password
          DATABASE_URL=postgres://marketplace:ci-only-password@postgres:5432/marketplace?sslmode=disable
          OTP_DELIVERY_URL=https://otp.example.test/send
          OTP_DELIVERY_TOKEN=ci-only-token
          OTP_PEPPER=0123456789abcdef0123456789abcdef
          SESSION_PEPPER=abcdef0123456789abcdef0123456789
          DEFAULT_TENANT_ID=market-om
          DEFAULT_MARKET_CODE=OM
          BOOTSTRAP_OPERATOR_PHONE=+96890000000
          EOF
          docker compose --env-file /tmp/mvp.env -f infra/compose.production.yml config --quiet
      - name: Build production API image
        run: docker build --file apps/api/Dockerfile --tag ai-service-marketplace-api:ci .
      - name: Build production web image
        run: docker build --file apps/web/Dockerfile --tag ai-service-marketplace-web:ci .
