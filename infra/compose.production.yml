services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [private]

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ai-service-marketplace-api:release
    entrypoint: ["/app/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ai-service-marketplace-api:release
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      OTP_DELIVERY_URL: ${OTP_DELIVERY_URL:?set OTP_DELIVERY_URL}
      OTP_DELIVERY_TOKEN: ${OTP_DELIVERY_TOKEN:?set OTP_DELIVERY_TOKEN}
      OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER}
      SESSION_PEPPER: ${SESSION_PEPPER:?set SESSION_PEPPER}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?set DEFAULT_TENANT_ID}
      DEFAULT_MARKET_CODE: ${DEFAULT_MARKET_CODE:?set DEFAULT_MARKET_CODE to a two-letter ISO country code}
      BOOTSTRAP_OPERATOR_PHONE: ${BOOTSTRAP_OPERATOR_PHONE:?set BOOTSTRAP_OPERATOR_PHONE in E.164 format}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [private]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: ai-service-marketplace-web:release
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [private]

  dispatch-worker:
    image: ai-service-marketplace-api:release
    entrypoint: ["/app/dispatch-worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [private]

  outbox-worker:
    profiles: ["outbox"]
    image: ai-service-marketplace-api:release
    entrypoint: ["/app/outbox-worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      OUTBOX_WORKER_ID: ${OUTBOX_WORKER_ID:-marketplace-outbox-1}
      OUTBOX_PUBLISH_URL: ${OUTBOX_PUBLISH_URL:-}
      OUTBOX_PUBLISH_TOKEN: ${OUTBOX_PUBLISH_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [private]

  analytics-worker:
    profiles: ["analytics"]
    image: ai-service-marketplace-api:release
    entrypoint: ["/app/analytics-worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ANALYTICS_TENANT_ID: ${ANALYTICS_TENANT_ID:-}
      ANALYTICS_GENERATION_ID: ${ANALYTICS_GENERATION_ID:-}
      ANALYTICS_WORKER_ID: ${ANALYTICS_WORKER_ID:-marketplace-analytics-1}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to a DNS name pointing at this host}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [private]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
